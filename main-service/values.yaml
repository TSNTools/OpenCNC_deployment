nameOverride: "main-service"
fullnameOverride: "main-service"

replicaCount: 1
annotations: {}

image:
  repository: main-service
  tag: v1.0
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "0.5"
    memory: 512Mi

service:
  type: ClusterIP

ports:
    http: 8080
    nni: 8000

nodeSelector: {}

tolerations: []

affinity: {}

#etcd:
 # enabled: false
  #username: ""
  #secretName: ""
#  endpoints: []

etcd:
  username: root
  secretName: etcd
  endpoints:
    - "http://etcd.default.svc.cluster.local:2379"
    
tls:
  enabled: true
  secretName: opencnc-shared-cert
  mountPath: /certs

